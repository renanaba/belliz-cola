<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<style>:root{color-scheme:light}html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Cola de Vendas Belliz</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Rubik:wght@500;700&display=swap">
<style>
/* Layout: uma coluna de celular com abas Quiz e Cola; cartões de produto com miniatura quadrada. */
:root {
  --bg: #FAF6F2;
  --surface: #FFFDFB;
  --line: #E6DDD5;
  --ink: #1E1630;
  --muted: #5A5068;
  --pink: #C41468;
  --pink-soft: #FCE3EE;
  --teal: #0B7F7C;
  --teal-soft: #DDF3F1;
  --ok: #1B7F3B;
  --ok-soft: #DDF3E3;
  --bad: #B3261E;
  --bad-soft: #FBE3E0;
  --on-accent: #FFFFFF;
  --font-display: 'Rubik', 'Arial', sans-serif;
  --font-body: 'DM Sans', 'Arial', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #17111F; --surface: #231A31; --line: #3A2E4C; --ink: #F3EEF8; --muted: #B9AED0;
    --pink: #FF7DB0; --pink-soft: #3A1B2D; --teal: #4FD1CB; --teal-soft: #14302F;
    --ok: #6EE08F; --ok-soft: #153423; --bad: #FF8A80; --bad-soft: #3D1B19; --on-accent: #17111F;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #17111F; --surface: #231A31; --line: #3A2E4C; --ink: #F3EEF8; --muted: #B9AED0;
  --pink: #FF7DB0; --pink-soft: #3A1B2D; --teal: #4FD1CB; --teal-soft: #14302F;
  --ok: #6EE08F; --ok-soft: #153423; --bad: #FF8A80; --bad-soft: #3D1B19; --on-accent: #17111F;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 17px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 48px; }
.wrap { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
header { display: flex; flex-direction: column; gap: 6px; }
.eyebrow { font-size: 13px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--pink); }
h1 { font-family: var(--font-display); font-weight: 700; font-size: 30px; line-height: 1.1; margin: 0; text-wrap: balance; }
h2 { font-family: var(--font-display); font-weight: 700; font-size: 24px; line-height: 1.2; margin: 0; text-wrap: balance; }
h3 { font-family: var(--font-display); font-weight: 500; font-size: 18px; line-height: 1.25; margin: 0; }
p { margin: 0; }
.sub { color: var(--muted); }
.tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: var(--line); padding: 4px; border-radius: 14px; }
.tab { font: inherit; font-weight: 700; padding: 12px 8px; border: 0; border-radius: 11px; background: transparent; color: var(--muted); cursor: pointer; min-height: 48px; }
.tab[aria-selected="true"] { background: var(--surface); color: var(--ink); }
:focus-visible { outline: 3px solid var(--teal); outline-offset: 2px; }
.panel { display: flex; flex-direction: column; gap: 16px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
label { font-weight: 700; font-size: 15px; }
input[type="text"], input[type="search"] { font: inherit; width: 100%; min-height: 52px; padding: 12px 14px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--bg); color: var(--ink); }
.btn { font: inherit; font-weight: 700; min-height: 52px; padding: 12px 20px; border-radius: 14px; border: 0; background: var(--pink); color: var(--on-accent); cursor: pointer; }
.btn.alt { background: transparent; color: var(--ink); border: 1.5px solid var(--line); }
.btn:disabled { opacity: .5; cursor: default; }
.rules { display: flex; flex-wrap: wrap; gap: 8px; }
.pill { font-size: 14px; font-weight: 700; padding: 4px 10px; border-radius: 999px; background: var(--teal-soft); color: var(--teal); }
.pill.pink { background: var(--pink-soft); color: var(--pink); }
.qhead { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-weight: 700; font-variant-numeric: tabular-nums; }
.bar { height: 10px; border-radius: 999px; background: var(--line); overflow: hidden; }
.bar > i { display: block; height: 100%; width: 100%; background: var(--teal); }
.bar > i.low { background: var(--bad); }
.opts { display: flex; flex-direction: column; gap: 10px; }
.opt { font: inherit; text-align: left; min-height: 56px; padding: 12px 16px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--bg); color: var(--ink); cursor: pointer; }
.opt.right { background: var(--ok-soft); border-color: var(--ok); }
.opt.wrong { background: var(--bad-soft); border-color: var(--bad); }
.opt:disabled { cursor: default; }
.fb { padding: 14px 16px; border-radius: 14px; background: var(--teal-soft); }
.fb strong { display: block; }
.score { font-family: var(--font-display); font-size: 64px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; color: var(--pink); }
.row { display: flex; flex-wrap: wrap; gap: 10px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { font: inherit; font-weight: 700; font-size: 15px; min-height: 44px; padding: 8px 14px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.count { font-size: 14px; color: var(--muted); }
.list { display: flex; flex-direction: column; gap: 12px; }
.item { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 14px; align-items: start; }
.item img { width: 84px; height: 84px; border-radius: 12px; object-fit: cover; background: var(--line); }
.item .body { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.meta { font-size: 14px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
.say { font-size: 16px; }
details summary { cursor: pointer; font-weight: 700; font-size: 15px; color: var(--teal); min-height: 32px; display: flex; align-items: center; }
details ul { margin: 6px 0 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; }
details .pair { margin-top: 8px; font-size: 15px; }
.note { font-size: 13px; color: var(--muted); }
@media (max-width: 420px) { .item { grid-template-columns: 64px minmax(0, 1fr); } .item img { width: 64px; height: 64px; } h1 { font-size: 26px; } }
@media (prefers-reduced-motion: no-preference) { .bar > i { transition: width .12s linear; } }
</style>

<div class="wrap">
  <header>
    <p class="eyebrow">Mix Belliz · Casa Norte Atacado</p>
    <h1>Cola de vendas</h1>
    <p class="sub">Faça o desafio e leve a frase de venda de cada produto no bolso.</p>
  </header>
  <div class="tabs" role="tablist" aria-label="Seções">
    <button class="tab" role="tab" id="tab-quiz" aria-selected="true" aria-controls="p-quiz" data-go="quiz">Desafio</button>
    <button class="tab" role="tab" id="tab-cola" aria-selected="false" aria-controls="p-cola" data-go="cola">Cola de vendas</button>
  </div>

  <section class="panel" id="p-quiz" role="tabpanel" aria-labelledby="tab-quiz"></section>

  <section class="panel" id="p-cola" role="tabpanel" aria-labelledby="tab-cola" hidden>
    <div class="card">
      <label for="busca">Buscar produto ou código</label>
      <input type="search" id="busca" placeholder="Ex.: Tipper, 2518, escova" autocomplete="off">
      <div class="chips" id="chips" role="group" aria-label="Filtrar por marca"></div>
    </div>
    <p class="count" id="count" aria-live="polite"></p>
    <div class="list" id="list"></div>
    <p class="note">Argumentos tirados das artes de divulgação de cada marca. Onde a arte traz asterisco, veja a condição na própria arte.</p>
  </section>
</div>

  { q:'As cores do pack com 4 Kess Pro (cód. 2518) foram inspiradas em quê?', a:'Nos géis dentais Kess Whitelicious',
    w:['Nos sabores do spray bucal fresh&go','Nas cores das escovas Basic Maxi','Nas fragrâncias da linha Ricca Flor'],

const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };

/* Abas */
function show(tab) {
  const quiz = tab !== 'cola';
  $('#p-quiz').hidden = !quiz; $('#p-cola').hidden = quiz;
  $('#tab-quiz').setAttribute('aria-selected', String(quiz));
  $('#tab-cola').setAttribute('aria-selected', String(!quiz));
}
document.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => {
  show(b.dataset.go);
  try { location.hash = b.dataset.go; } catch (e) {}
}));
function fromHash() { show(location.hash === '#cola' ? 'cola' : 'quiz'); }
window.addEventListener('hashchange', fromHash);
fromHash();

/* Desafio */
const QUIZ_MS = 20000;
let S = { name:'', i:0, pts:0, hits:0, order:[], t0:0, timer:null, locked:false };
const quizEl = $('#p-quiz');

function renderStart() {
  quizEl.innerHTML = `
    <div class="card">
      <h2>Desafio relâmpago</h2>
      <p>5 perguntas sobre os 5 destaques. Cada uma vale até 200 pontos: 100 por acertar e até 100 pela velocidade.</p>
      <div class="rules"><span class="pill">5 perguntas</span><span class="pill">20 segundos cada</span><span class="pill pink">máximo 1000 pontos</span></div>
      <label for="nome">Seu nome</label>
      <input type="text" id="nome" placeholder="Como você quer aparecer" autocomplete="given-name" maxlength="30">
      <button class="btn" id="go">Começar</button>
    </div>`;
  $('#go').addEventListener('click', () => {
    S = { name: ($('#nome').value || '').trim() || 'Sem nome', i:0, pts:0, hits:0, order:QUESTIONS.map((_,k)=>k), t0:0, timer:null, locked:false };
    renderQuestion();
  });
}

function renderQuestion() {
  const q = QUESTIONS[S.order[S.i]];
  const opts = shuffle([{t:q.a, ok:true}, ...q.w.map(t => ({t, ok:false}))]);
  S.locked = false; S.current = { q, opts };
  quizEl.innerHTML = `
    <div class="card">
      <div class="qhead"><span>Pergunta ${S.i+1} de ${QUESTIONS.length}</span><span id="secs">20 s</span></div>
      <div class="bar" aria-hidden="true"><i id="fill"></i></div>
      <h2>${esc(q.q)}</h2>
      <div class="opts" id="opts">${opts.map((o,k) => `<button class="opt" data-k="${k}">${esc(o.t)}</button>`).join('')}</div>
      <div id="fb" aria-live="polite"></div>
    </div>`;
  $('#opts').addEventListener('click', e => { const b = e.target.closest('.opt'); if (b) answer(+b.dataset.k); });
  S.t0 = Date.now();
  clearInterval(S.timer);
  S.timer = setInterval(tick, 100); tick();
}

function tick() {
  const left = Math.max(0, QUIZ_MS - (Date.now() - S.t0));
  const fill = $('#fill'); if (!fill) return;
  fill.style.width = (left / QUIZ_MS * 100) + '%';
  fill.classList.toggle('low', left < 5000);
  $('#secs').textContent = Math.ceil(left / 1000) + ' s';
  if (left <= 0 && !S.locked) answer(-1);
}

function answer(k) {
  if (S.locked) return;
  S.locked = true; clearInterval(S.timer);
  const left = Math.max(0, QUIZ_MS - (Date.now() - S.t0));
  const { q, opts } = S.current;
  const ok = k >= 0 && opts[k].ok;
  const gain = ok ? 100 + Math.round(100 * left / QUIZ_MS) : 0;
  if (ok) { S.pts += gain; S.hits++; }
  document.querySelectorAll('.opt').forEach((b, idx) => {
    b.disabled = true;
    if (opts[idx].ok) b.classList.add('right');
    else if (idx === k) b.classList.add('wrong');
  });
  const last = S.i === QUESTIONS.length - 1;
  const head = k < 0 ? 'Tempo esgotado.' : ok ? `Acertou! +${gain} pontos` : 'Não foi dessa vez.';
  $('#fb').innerHTML = `<div class="fb"><strong>${head}</strong><p>${esc(q.why)}</p></div>
    <div class="row" style="margin-top:14px"><button class="btn" id="next">${last ? 'Ver meu resultado' : 'Próxima pergunta'}</button></div>`;
  $('#next').addEventListener('click', () => { if (last) renderResult(); else { S.i++; renderQuestion(); } });
  $('#next').focus();
}

function renderResult() {
  const msg = S.hits === 5 ? 'Perfeito. Pode vender qualquer um dos cinco.'
    : S.hits >= 3 ? 'Muito bem. Dê uma olhada na cola de vendas nos que errou.'
    : 'Passe pela cola de vendas antes da próxima visita ao lojista.';
  quizEl.innerHTML = `
    <div class="card">
      <p class="eyebrow">Resultado de ${esc(S.name)}</p>
      <p class="score">${S.pts}</p>
      <p><strong>${S.hits} de ${QUESTIONS.length}</strong> respostas certas. ${msg}</p>
      <p class="sub">Mostre esta tela ao apresentador para comparar a pontuação.</p>
      <div class="row">
        <button class="btn" id="cola">Abrir a cola de vendas</button>
        <button class="btn alt" id="again">Jogar de novo</button>
      </div>
    </div>`;
  $('#cola').addEventListener('click', () => { show('cola'); try { location.hash = 'cola'; } catch (e) {} window.scrollTo(0, 0); });
  $('#again').addEventListener('click', renderStart);
}
renderStart();

/* Cola de vendas */
const BRANDS = ['Todos', 'Destaques', 'Kess', 'Belliz', 'Ricca', 'Enox'];
let filter = 'Todos', term = '';
function renderChips() {
  $('#chips').innerHTML = BRANDS.map(b => `<button class="chip" data-b="${b}" aria-pressed="${b === filter}">${b}</button>`).join('');
}
function matches(p) {
  if (filter === 'Destaques' && !p.top) return false;
  if (filter !== 'Todos' && filter !== 'Destaques' && p.brand !== filter) return false;
  if (!term) return true;
  const hay = (p.brand + ' ' + p.name + ' ' + p.code + ' ' + p.say + ' ' + p.points.join(' ')).toLowerCase();
  return hay.includes(term);
}
function renderList() {
  const items = PRODUCTS.filter(matches);
  $('#count').textContent = items.length === 1 ? '1 produto' : items.length + ' produtos';
  $('#list').innerHTML = items.length ? items.map(p => `
    <article class="item">
      <img src="${THUMBS[p.id]}" alt="" width="84" height="84">
      <div class="body">
        <div><h3>${esc(p.name)}</h3>
          <div class="meta"><span>${esc(p.brand)}</span>${p.code ? `<span>${esc(p.code.match(/^\d/) ? 'cód. ' + p.code : p.code)}</span>` : ''}${p.top ? '<span class="pill pink">Destaque</span>' : ''}</div></div>
        <p class="say">“${esc(p.say)}”</p>
        <details><summary>Argumentos</summary>
          <ul>${p.points.map(x => `<li>${esc(x)}</li>`).join('')}</ul>
          ${p.pair ? `<p class="pair"><strong>Venda junto:</strong> ${esc(p.pair)}</p>` : ''}
        </details>
      </div>
    </article>`).join('') : '<div class="card"><p>Nenhum produto encontrado. Tente outro nome ou apague o filtro.</p></div>';
}
$('#chips').addEventListener('click', e => { const b = e.target.closest('.chip'); if (!b) return; filter = b.dataset.b; renderChips(); renderList(); });
$('#busca').addEventListener('input', e => { term = e.target.value.trim().toLowerCase(); renderList(); });
renderChips(); renderList();
</script>
